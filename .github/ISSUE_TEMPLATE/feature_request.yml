name: Feature request
description: Suggest an idea for VibePause
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues on GitHub are public.** Please do not include personal information (such as your email, real name or account details).
  - type: textarea
    id: idea
    attributes:
      label: What would you like VibePause to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do that is hard or impossible today?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried instead?
  - type: checkboxes
    id: public
    attributes:
      label: Public post
      options:
        - label: I understand this issue is public and I have not included personal information.
          required: true
