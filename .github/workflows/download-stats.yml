name: Download stats

on:
  schedule:
    - cron: "15 0 * * *"   # every day at 00:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record downloads and redraw the graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/download_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads.csv docs/downloads.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update download stats"
            git push
          fi
