name: Build VibePause

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # Download source archive
      # --------------------------------------------------
      - name: Download VibePause source
        shell: pwsh
        run: |
          # Keep your existing download command here if
          # VibePause_src.zip is downloaded from somewhere.
          #
          # If the ZIP is already present in the repository,
          # this step does nothing.

          if (!(Test-Path "VibePause_src.zip")) {
            throw "VibePause_src.zip was not found."
          }

      # --------------------------------------------------
      # Inspect ZIP layout
      # --------------------------------------------------
      - name: Inspect source archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::OpenRead("VibePause_src.zip")

          Write-Host "===== VibePause_src.zip contents ====="

          foreach ($entry in $zip.Entries) {
            Write-Host $entry.FullName
          }

          Write-Host "======================================"

          $zip.Dispose()

      # --------------------------------------------------
      # Unpack source
      # --------------------------------------------------
      - name: Unpack VibePause source
        shell: pwsh
        run: |
          Write-Host "Cleaning old source directory..."

          Remove-Item -Recurse -Force "src" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ".tmp_vibepause" -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path "src" | Out-Null

          Write-Host "Extracting VibePause_src.zip..."

          Expand-Archive `
            -Path "VibePause_src.zip" `
            -DestinationPath ".tmp_vibepause" `
            -Force

          Write-Host "Extracted archive structure:"
          Get-ChildItem ".tmp_vibepause" -Recurse |
            Select-Object FullName

          # ------------------------------------------------
          # Your ZIP contains:
          #
          # src/
          #   VibePause.pyw
          #
          # installer/
          #   VibePause.iss
          #
          # assets/
          #
          # VibePause.spec
          # ------------------------------------------------

          Write-Host "Copying application source..."

          if (Test-Path ".tmp_vibepause\src") {
            Copy-Item `
              ".tmp_vibepause\src\*" `
              "src" `
              -Recurse `
              -Force
          }
          else {
            throw "The ZIP does not contain a src directory."
          }

          Write-Host "Copying installer..."

          if (Test-Path ".tmp_vibepause\installer") {
            New-Item `
              -ItemType Directory `
              -Path "src\installer" `
              -Force | Out-Null

            Copy-Item `
              ".tmp_vibepause\installer\*" `
              "src\installer" `
              -Recurse `
              -Force
          }
          else {
            throw "The ZIP does not contain an installer directory."
          }

          Write-Host "Copying assets..."

          if (Test-Path ".tmp_vibepause\assets") {
            New-Item `
              -ItemType Directory `
              -Path "src\assets" `
              -Force | Out-Null

            Copy-Item `
              ".tmp_vibepause\assets\*" `
              "src\assets" `
              -Recurse `
              -Force
          }

          # ------------------------------------------------
          # Copy root-level files
          # ------------------------------------------------

          $rootFiles = @(
            "VibePause.spec",
            "VibePause.ico",
            "PRIVACY_POLICY.md",
            "TERMS_AND_CONDITIONS.md",
            "THIRD_PARTY_NOTICES.md"
          )

          foreach ($file in $rootFiles) {

            $source = ".tmp_vibepause\$file"

            if (Test-Path $source) {

              Write-Host "Copying $file..."

              Copy-Item `
                $source `
                "src\$file" `
                -Force
            }
          }

          # Cleanup
          Remove-Item `
            -Recurse `
            -Force `
            ".tmp_vibepause"

          # ------------------------------------------------
          # Verify final source layout
          # ------------------------------------------------

          Write-Host ""
          Write-Host "===== FINAL SOURCE LAYOUT ====="

          Get-ChildItem "src" -Recurse |
            Select-Object FullName

          Write-Host "================================"

      # --------------------------------------------------
      # Verify source layout
      # --------------------------------------------------
      - name: Verify source layout
        shell: pwsh
        run: |
          $required = @(
            "src\VibePause.pyw",
            "src\installer\VibePause.iss",
            "src\VibePause.spec"
          )

          foreach ($file in $required) {

            if (!(Test-Path $file)) {
              Write-Host ""
              Write-Host "===== DEBUG: SOURCE TREE ====="

              if (Test-Path "src") {
                Get-ChildItem "src" -Recurse |
                  Select-Object FullName
              }

              Write-Host "=============================="

              throw "Required source file is missing: $file"
            }

            Write-Host "Found: $file"
          }

          Write-Host ""
          Write-Host "Source layout verification passed."

      # --------------------------------------------------
      # Verify version numbers match
      # --------------------------------------------------
      - name: Verify version numbers match
        shell: pwsh
        run: |
          $pyFile = "src\VibePause.pyw"
          $issFile = "src\installer\VibePause.iss"

          if (!(Test-Path $pyFile)) {
            throw "Cannot find path $pyFile"
          }

          if (!(Test-Path $issFile)) {
            throw "Cannot find path $issFile"
          }

          Write-Host "Reading version from $pyFile..."

          $pyContent = Get-Content $pyFile -Raw

          Write-Host "Reading version from $issFile..."

          $issContent = Get-Content $issFile -Raw

          # -----------------------------------------------
          # Python version
          # -----------------------------------------------

          $pyMatch = [regex]::Match(
            $pyContent,
            '(?m)^\s*(?:APP_VERSION|VERSION|__version__)\s*=\s*["'']([^"'']+)["'']'
          )

          if (!$pyMatch.Success) {
            throw "Could not find application version in $pyFile"
          }

          $pyVersion = $pyMatch.Groups[1].Value

          # -----------------------------------------------
          # Inno Setup version
          # -----------------------------------------------

          $issMatch = [regex]::Match(
            $issContent,
            '(?im)^\s*#define\s+MyAppVersion\s+["'']([^"'']+)["'']'
          )

          if (!$issMatch.Success) {
            throw "Could not find MyAppVersion in $issFile"
          }

          $issVersion = $issMatch.Groups[1].Value

          Write-Host ""
          Write-Host "Python version : $pyVersion"
          Write-Host "Installer version : $issVersion"
          Write-Host ""

          if ($pyVersion -ne $issVersion) {
            throw "Version mismatch! Python=$pyVersion, Installer=$issVersion"
          }

          Write-Host "Version numbers match: $pyVersion"

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "src\requirements.txt") {
            pip install -r "src\requirements.txt"
          }

          pip install pyinstaller

      # --------------------------------------------------
      # Build executable
      # --------------------------------------------------
      - name: Build VibePause
        shell: pwsh
        run: |
          cd src

          pyinstaller `
            --clean `
            --noconfirm `
            "VibePause.spec"

      # --------------------------------------------------
      # Install Inno Setup
      # --------------------------------------------------
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      # --------------------------------------------------
      # Build installer
      # --------------------------------------------------
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "src\installer\VibePause.iss"

      # --------------------------------------------------
      # Upload build artifacts
      # --------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VibePause
          path: |
            src\dist\**
            src\installer\*.exe
