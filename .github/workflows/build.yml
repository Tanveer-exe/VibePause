name: Build VibePause

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # Verify source archive exists
      # --------------------------------------------------
      - name: Verify source archive
        shell: pwsh
        run: |
          if (!(Test-Path "VibePause_src.zip")) {
            throw "VibePause_src.zip was not found."
          }

          Write-Host "Found VibePause_src.zip"

      # --------------------------------------------------
      # Inspect ZIP
      # --------------------------------------------------
      - name: Inspect source archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::OpenRead("VibePause_src.zip")

          Write-Host ""
          Write-Host "===== VibePause_src.zip contents ====="

          foreach ($entry in $zip.Entries) {
            Write-Host $entry.FullName
          }

          Write-Host "======================================"
          Write-Host ""

          $zip.Dispose()

      # --------------------------------------------------
      # Unpack VibePause source
      # --------------------------------------------------
      - name: Unpack VibePause source
        shell: pwsh
        run: |
          $extractRoot = Join-Path $env:RUNNER_TEMP "VibePause_source"

          Write-Host "Cleaning previous extraction..."

          Remove-Item `
            -Recurse `
            -Force `
            "src" `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -Recurse `
            -Force `
            $extractRoot `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $extractRoot `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "src" `
            -Force | Out-Null

          Write-Host "Extracting VibePause_src.zip..."

          Expand-Archive `
            -Path "VibePause_src.zip" `
            -DestinationPath $extractRoot `
            -Force

          Write-Host ""
          Write-Host "===== Extracted archive ====="

          Get-ChildItem `
            -Path $extractRoot `
            -Recurse |
            Select-Object FullName

          Write-Host "============================="
          Write-Host ""

          # ------------------------------------------------
          # Find VibePause.pyw anywhere in the archive.
          # This makes the workflow tolerant of an extra
          # top-level folder if the ZIP structure changes.
          # ------------------------------------------------

          $entry = Get-ChildItem `
            -Path $extractRoot `
            -Filter "VibePause.pyw" `
            -File `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $entry) {
            Write-Host "VibePause.pyw was not found."
            Write-Host ""
            Write-Host "Archive contents:"
            
            Get-ChildItem `
              -Path $extractRoot `
              -Recurse |
              Select-Object FullName

            throw "VibePause.pyw was not found in VibePause_src.zip"
          }

          # The directory containing VibePause.pyw is the
          # actual source directory.
          $sourceRoot = $entry.Directory.FullName

          Write-Host "Detected application source root:"
          Write-Host $sourceRoot

          # ------------------------------------------------
          # Copy the source directory contents into src
          # ------------------------------------------------

          Write-Host ""
          Write-Host "Copying application source..."

          Copy-Item `
            -Path (Join-Path $sourceRoot "*") `
            -Destination "src" `
            -Recurse `
            -Force

          # ------------------------------------------------
          # Find installer directory.
          # ------------------------------------------------

          $installerFile = Get-ChildItem `
            -Path $extractRoot `
            -Filter "VibePause.iss" `
            -File `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $installerFile) {
            throw "VibePause.iss was not found in VibePause_src.zip"
          }

          $installerRoot = $installerFile.Directory.FullName

          Write-Host ""
          Write-Host "Detected installer directory:"
          Write-Host $installerRoot

          New-Item `
            -ItemType Directory `
            -Path "src\installer" `
            -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $installerRoot "*") `
            -Destination "src\installer" `
            -Recurse `
            -Force

          # ------------------------------------------------
          # Copy assets
          # ------------------------------------------------

          $assetsDir = Get-ChildItem `
            -Path $extractRoot `
            -Directory `
            -Recurse |
            Where-Object { $_.Name -eq "assets" } |
            Select-Object -First 1

          if ($null -ne $assetsDir) {

            Write-Host ""
            Write-Host "Copying assets..."

            New-Item `
              -ItemType Directory `
              -Path "src\assets" `
              -Force | Out-Null

            Copy-Item `
              -Path (Join-Path $assetsDir.FullName "*") `
              -Destination "src\assets" `
              -Recurse `
              -Force
          }

          # ------------------------------------------------
          # Find and copy VibePause.spec
          # ------------------------------------------------

          $specFile = Get-ChildItem `
            -Path $extractRoot `
            -Filter "VibePause.spec" `
            -File `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $specFile) {
            throw "VibePause.spec was not found in VibePause_src.zip"
          }

          Copy-Item `
            -Path $specFile.FullName `
            -Destination "src\VibePause.spec" `
            -Force

          # ------------------------------------------------
          # Find and copy VibePause.ico
          # ------------------------------------------------

          $iconFile = Get-ChildItem `
            -Path $extractRoot `
            -Filter "VibePause.ico" `
            -File `
            -Recurse |
            Select-Object -First 1

          if ($null -ne $iconFile) {
            Copy-Item `
              -Path $iconFile.FullName `
              -Destination "src\VibePause.ico" `
              -Force
          }

          # ------------------------------------------------
          # Copy legal files
          # ------------------------------------------------

          $legalFiles = @(
            "PRIVACY_POLICY.md",
            "TERMS_AND_CONDITIONS.md",
            "THIRD_PARTY_NOTICES.md"
          )

          foreach ($file in $legalFiles) {

            $found = Get-ChildItem `
              -Path $extractRoot `
              -Filter $file `
              -File `
              -Recurse |
              Select-Object -First 1

            if ($null -ne $found) {

              Write-Host "Copying $file..."

              Copy-Item `
                -Path $found.FullName `
                -Destination "src\$file" `
                -Force
            }
          }

          # ------------------------------------------------
          # Cleanup
          # ------------------------------------------------

          Remove-Item `
            -Recurse `
            -Force `
            $extractRoot

          # ------------------------------------------------
          # Show final layout
          # ------------------------------------------------

          Write-Host ""
          Write-Host "===== FINAL SOURCE LAYOUT ====="

          Get-ChildItem `
            -Path "src" `
            -Recurse |
            Select-Object FullName

          Write-Host "================================"
          Write-Host ""

      # --------------------------------------------------
      # Verify source layout
      # --------------------------------------------------
      - name: Verify source layout
        shell: pwsh
        run: |
          $required = @(
            "src\VibePause.pyw",
            "src\installer\VibePause.iss",
            "src\VibePause.spec"
          )

          foreach ($file in $required) {

            if (!(Test-Path $file)) {

              Write-Host ""
              Write-Host "===== DEBUG: SOURCE TREE ====="

              if (Test-Path "src") {
                Get-ChildItem `
                  -Path "src" `
                  -Recurse |
                  Select-Object FullName
              }

              Write-Host "=============================="

              throw "Required source file is missing: $file"
            }

            Write-Host "Found: $file"
          }

          Write-Host ""
          Write-Host "Source layout verification passed."

      # --------------------------------------------------
      # Verify version numbers match
      # --------------------------------------------------
      - name: Verify version numbers match
        shell: pwsh
        run: |
          $pyFile = "src\VibePause.pyw"
          $issFile = "src\installer\VibePause.iss"

          if (!(Test-Path $pyFile)) {
            throw "Cannot find path '$pyFile'"
          }

          if (!(Test-Path $issFile)) {
            throw "Cannot find path '$issFile'"
          }

          Write-Host "Reading version from $pyFile..."

          $pyContent = Get-Content `
            $pyFile `
            -Raw

          Write-Host "Reading version from $issFile..."

          $issContent = Get-Content `
            $issFile `
            -Raw

          # ------------------------------------------------
          # Python version
          # Actual VibePause.pyw contains:
          #
          # APP_VERSION = "0.1.3"
          # ------------------------------------------------

          $pyMatch = [regex]::Match(
            $pyContent,
            '(?m)^\s*APP_VERSION\s*=\s*["'']([^"'']+)["'']'
          )

          if (!$pyMatch.Success) {
            throw "Could not find APP_VERSION in $pyFile"
          }

          $pyVersion = $pyMatch.Groups[1].Value

          # ------------------------------------------------
          # Inno Setup version
          # Actual VibePause.iss contains:
          #
          # AppVersion=0.1.3
          # ------------------------------------------------

          $issMatch = [regex]::Match(
            $issContent,
            '(?im)^\s*AppVersion\s*=\s*([^\r\n]+)'
          )

          if (!$issMatch.Success) {
            throw "Could not find AppVersion in $issFile"
          }

          $issVersion = $issMatch.Groups[1].Value.Trim()

          Write-Host ""
          Write-Host "Python version    : $pyVersion"
          Write-Host "Installer version : $issVersion"
          Write-Host ""

          if ($pyVersion -ne $issVersion) {
            throw "Version mismatch! Python=$pyVersion, Installer=$issVersion"
          }

          Write-Host "Version numbers match: $pyVersion"

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "src\requirements.txt") {
            pip install -r "src\requirements.txt"
          }

          pip install pyinstaller

      # --------------------------------------------------
      # Build executable
      # --------------------------------------------------
      - name: Build VibePause
        shell: pwsh
        run: |
          Set-Location "src"

          pyinstaller `
            --clean `
            --noconfirm `
            "VibePause.spec"

      # --------------------------------------------------
      # Install Inno Setup
      # --------------------------------------------------
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup `
            --yes `
            --no-progress

      # --------------------------------------------------
      # Build installer
      # --------------------------------------------------
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }

          & $iscc "src\installer\VibePause.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      # --------------------------------------------------
      # Upload build artifacts
      # --------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VibePause
          path: |
            src\dist\**
            src\installer_output\*.exe
