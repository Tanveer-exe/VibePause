name: Build VibePause

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare source
        shell: pwsh
        run: |
          Copy-Item -Path "LICENSE" -Destination "src\LICENSE" -Force
          foreach ($f in "src\VibePause.pyw", "src\VibePause.spec", "src\installer\VibePause.iss") {
            if (!(Test-Path $f)) { throw "Required file missing: $f" }
            Write-Host "Found: $f"
          }

      - name: Verify version numbers match
        shell: pwsh
        run: |
          $py  = [regex]::Match((Get-Content "src\VibePause.pyw" -Raw),
                   '(?m)^\s*APP_VERSION\s*=\s*["'']([^"'']+)["'']')
          $iss = [regex]::Match((Get-Content "src\installer\VibePause.iss" -Raw),
                   '(?im)^\s*AppVersion\s*=\s*([^\r\n]+)')

          if (!$py.Success)  { throw "APP_VERSION not found in VibePause.pyw" }
          if (!$iss.Success) { throw "AppVersion not found in VibePause.iss" }

          $pyVersion  = $py.Groups[1].Value.Trim()
          $issVersion = $iss.Groups[1].Value.Trim()

          Write-Host "Python version    : $pyVersion"
          Write-Host "Installer version : $issVersion"

          if ($pyVersion -ne $issVersion) {
            throw "Version mismatch! Python=$pyVersion, Installer=$issVersion"
          }
          Write-Host "Version numbers match: $pyVersion"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v", "V")
            if ($tagVersion -ne $pyVersion) {
              throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $pyVersion"
            }
            Write-Host "Tag matches version: $tagVersion"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "src\requirements.txt") {
            pip install -r "src\requirements.txt"
          }
          pip install pyinstaller==6.22.3

      - name: Build VibePause
        shell: pwsh
        working-directory: src
        run: |
          pyinstaller --clean --noconfirm VibePause.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed ($LASTEXITCODE)" }
          if (!(Test-Path "dist\VibePause\VibePause.exe")) {
            throw "dist\VibePause\VibePause.exe was not produced"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # The dark installer window needs Inno Setup 6.6 or newer. The runner image may ship an
          # older 6.x, so upgrade (this also installs it if missing). If the upgrade fails, the
          # installed version still builds the installer, just with the light style.
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not upgrade Inno Setup; using the installed version."
            $global:LASTEXITCODE = 0
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          Write-Host "Inno Setup version: $((Get-Item $iscc).VersionInfo.ProductVersion)"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

          & $iscc "src\installer\VibePause.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Create checksum
        shell: pwsh
        run: |
          $exe = "src\installer_output\VibePause_Setup.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VibePause_Setup.exe" | Set-Content -Path "$exe.sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # Use the matching section of CHANGELOG.md as the release notes (the app shows these in
          # its update prompt). If there is none, GitHub generates notes instead.
          $version = $env:GITHUB_REF_NAME.TrimStart("v", "V")
          if (Test-Path "CHANGELOG.md") {
            $text = Get-Content "CHANGELOG.md" -Raw
            $pattern = '(?ms)^##\s+\[?v?' + [regex]::Escape($version) + '\]?[^\r\n]*\r?\n(.*?)(?=^##\s|\z)'
            $m = [regex]::Match($text, $pattern)
            if ($m.Success -and $m.Groups[1].Value.Trim()) {
              Set-Content -Path "release_notes.md" -Value $m.Groups[1].Value.Trim() -Encoding utf8
              Write-Host "Using the CHANGELOG.md section for $version"
            }
          }
          if (!(Test-Path "release_notes.md")) { Write-Host "No CHANGELOG.md section for $version; GitHub will generate notes." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VibePause-Setup
          path: src/installer_output/VibePause_Setup.exe
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: VibePause-portable
          path: src/dist/VibePause
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = @()
          if (Test-Path "release_notes.md") { $extra += @("--notes-file", "release_notes.md") } else { $extra += "--generate-notes" }
          if ($env:GITHUB_REF_NAME.Contains("-")) { $extra += "--prerelease" }
          $files = @("src/installer_output/VibePause_Setup.exe", "src/installer_output/VibePause_Setup.exe.sha256")
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files @extra
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed ($LASTEXITCODE)" }
