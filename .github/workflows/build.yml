name: Build VibePause

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unpack VibePause source
        shell: pwsh
        run: |
          if (!(Test-Path "VibePause_src.zip")) {
            throw "VibePause_src.zip was not found in the repository root."
          }

          $temp = Join-Path $env:RUNNER_TEMP "vibepause_extract"
          Remove-Item $temp, "src" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $temp, "src" -Force | Out-Null

          Expand-Archive -Path "VibePause_src.zip" -DestinationPath $temp -Force

          # Source root = the folder that contains VibePause.pyw
          # (tolerates an extra top-level folder in the zip).
          $pyw = Get-ChildItem -Path $temp -Filter "VibePause.pyw" -File -Recurse |
            Select-Object -First 1

          if ($null -eq $pyw) {
            Get-ChildItem $temp -Recurse | Select-Object FullName
            throw "VibePause.pyw was not found in VibePause_src.zip"
          }

          Copy-Item -Path (Join-Path $pyw.Directory.FullName "*") -Destination "src" -Recurse -Force
          Copy-Item -Path "LICENSE" -Destination "src\LICENSE" -Force

          Write-Host "===== src layout ====="
          Get-ChildItem "src" -Recurse | Where-Object { $_.FullName -notmatch '\\assets\\' } | Select-Object FullName
          Write-Host "======================"

          foreach ($f in "src\VibePause.pyw", "src\VibePause.spec", "src\installer\VibePause.iss") {
            if (!(Test-Path $f)) { throw "Required file missing after unpack: $f" }
            Write-Host "Found: $f"
          }

      - name: Verify version numbers match
        shell: pwsh
        run: |
          $py  = [regex]::Match((Get-Content "src\VibePause.pyw" -Raw),
                   '(?m)^\s*APP_VERSION\s*=\s*["'']([^"'']+)["'']')
          $iss = [regex]::Match((Get-Content "src\installer\VibePause.iss" -Raw),
                   '(?im)^\s*AppVersion\s*=\s*([^\r\n]+)')

          if (!$py.Success)  { throw "APP_VERSION not found in VibePause.pyw" }
          if (!$iss.Success) { throw "AppVersion not found in VibePause.iss" }

          $pyVersion  = $py.Groups[1].Value.Trim()
          $issVersion = $iss.Groups[1].Value.Trim()

          Write-Host "Python version    : $pyVersion"
          Write-Host "Installer version : $issVersion"

          if ($pyVersion -ne $issVersion) {
            throw "Version mismatch! Python=$pyVersion, Installer=$issVersion"
          }
          Write-Host "Version numbers match: $pyVersion"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "src\requirements.txt") {
            pip install -r "src\requirements.txt"
          }
          pip install pyinstaller==6.22.3

      - name: Build VibePause
        shell: pwsh
        working-directory: src
        run: |
          pyinstaller --clean --noconfirm VibePause.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed ($LASTEXITCODE)" }
          if (!(Test-Path "dist\VibePause\VibePause.exe")) {
            throw "dist\VibePause\VibePause.exe was not produced"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

          & $iscc "src\installer\VibePause.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VibePause-Setup
          path: src/installer_output/VibePause_Setup.exe
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: VibePause-portable
          path: src/dist/VibePause
          if-no-files-found: error
