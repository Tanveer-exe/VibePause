name: Build VibePause

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unpack VibePause source
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src -ErrorAction SilentlyContinue
          Expand-Archive -Path VibePause_src.zip -DestinationPath src -Force
          $spec = Get-ChildItem -Path src -Filter VibePause.spec -Recurse | Select-Object -First 1

          if (-not $spec) {
            throw "VibePause.spec not found in extracted archive"
          }

          if ($spec.Directory.FullName -ne (Resolve-Path src).Path) {
            Move-Item -Path (Join-Path $spec.Directory.FullName '*') -Destination src -Force
          }

          $iss = Get-ChildItem -Path src -Filter VibePause.iss -Recurse | Select-Object -First 1

          if (-not $iss) {
            throw "installer/VibePause.iss not found in extracted archive"
          }

          $content = Get-Content -Path $iss.FullName -Raw
          if ($content -notmatch '(?im)^\s*AppVersion\s*=') {
            if ($content -notmatch '(?im)^\s*\[Setup\]\s*$') {
              throw "[Setup] section not found in $($iss.FullName)"
            }

            $content = $content -replace '(?im)^\s*\[Setup\]\s*$', "[Setup]`r`nAppVersion=1.0.0"
            Set-Content -Path $iss.FullName -Value $content -NoNewline
          }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            pyinstaller `
            pystray `
            pillow `
            winrt-runtime `
            winrt-Windows.Media.Control `
            winrt-Windows.Foundation `
            winrt-Windows.Foundation.Collections

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build VibePause EXE
        working-directory: src
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean VibePause.spec

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "src\dist\VibePause\VibePause.exe"

          if (!(Test-Path $exe)) {
            Write-Host "VibePause.exe was not created."
            Get-ChildItem -Recurse "src\dist" -ErrorAction SilentlyContinue
            throw "EXE missing"
          }

          Write-Host "VibePause.exe created successfully."

      - name: Build VibePause Setup.exe
        working-directory: src
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer\VibePause.iss"

      - name: Verify Setup.exe
        shell: pwsh
        run: |
          $setup = "src\installer_output\VibePause_Setup.exe"

          if (!(Test-Path $setup)) {
            Write-Host "VibePause_Setup.exe was not created."
            Get-ChildItem -Recurse "src\installer_output" -ErrorAction SilentlyContinue
            throw "Setup.exe missing"
          }

          Write-Host "VibePause_Setup.exe created successfully."

      - name: Upload VibePause installer
        uses: actions/upload-artifact@v7
        with:
          name: VibePause_Setup
          path: src/installer_output/VibePause_Setup.exe
          if-no-files-found: error
