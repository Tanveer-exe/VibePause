name: Build VibePause

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare source
        shell: pwsh
        run: |
          Copy-Item -Path "LICENSE" -Destination "src\LICENSE" -Force
          foreach ($f in "src\VibePause.pyw", "src\VibePause.spec", "src\installer\VibePause.iss") {
            if (!(Test-Path $f)) { throw "Required file missing: $f" }
            Write-Host "Found: $f"
          }

      - name: Verify version numbers match
        shell: pwsh
        run: |
          $py  = [regex]::Match((Get-Content "src\VibePause.pyw" -Raw),
                   '(?m)^\s*APP_VERSION\s*=\s*["'']([^"'']+)["'']')
          $iss = [regex]::Match((Get-Content "src\installer\VibePause.iss" -Raw),
                   '(?im)^\s*AppVersion\s*=\s*([^\r\n]+)')

          if (!$py.Success)  { throw "APP_VERSION not found in VibePause.pyw" }
          if (!$iss.Success) { throw "AppVersion not found in VibePause.iss" }

          $pyVersion  = $py.Groups[1].Value.Trim()
          $issVersion = $iss.Groups[1].Value.Trim()

          Write-Host "Python version    : $pyVersion"
          Write-Host "Installer version : $issVersion"

          if ($pyVersion -ne $issVersion) {
            throw "Version mismatch! Python=$pyVersion, Installer=$issVersion"
          }
          Write-Host "Version numbers match: $pyVersion"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v", "V")
            if ($tagVersion -ne $pyVersion) {
              throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $pyVersion"
            }
            Write-Host "Tag matches version: $tagVersion"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "src\requirements.txt") {
            pip install -r "src\requirements.txt"
          }
          pip install pyinstaller==6.22.3

      - name: Build VibePause
        shell: pwsh
        working-directory: src
        run: |
          pyinstaller --clean --noconfirm VibePause.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed ($LASTEXITCODE)" }
          if (!(Test-Path "dist\VibePause\VibePause.exe")) {
            throw "dist\VibePause\VibePause.exe was not produced"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

          & $iscc "src\installer\VibePause.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VibePause-Setup
          path: src/installer_output/VibePause_Setup.exe
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: VibePause-portable
          path: src/dist/VibePause
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = @("--generate-notes")
          if ($env:GITHUB_REF_NAME.Contains("-")) { $extra += "--prerelease" }
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME "src/installer_output/VibePause_Setup.exe" --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME "src/installer_output/VibePause_Setup.exe" @extra
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed ($LASTEXITCODE)" }
