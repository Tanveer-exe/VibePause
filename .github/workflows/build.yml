name: Build VibePause
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install -U pip pyinstaller pystray pillow winrt-runtime winrt-Windows.Media.Control winrt-Windows.Foundation winrt-Windows.Foundation.Collections
          choco install innosetup -y --no-progress
      - name: Build VibePause.exe
        run: python -m PyInstaller --noconfirm --clean VibePause.spec
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\VibePause.iss'
      - name: Check output
        run: |
          if (!(Test-Path dist\VibePause\VibePause.exe)) { throw "EXE missing" }
          if (!(Test-Path installer_output\VibePause_Setup.exe)) { throw "Setup missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: VibePause_Setup
          path: installer_output/VibePause_Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VibePause_portable
          path: dist/VibePause/
