<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a1c; --panel:#14142b; --panel2:#1e1e3d; --panel3:#2a2a52;
  --text:#f1efff; --muted:#9c9ac4; --faint:#6f6d98;
  --red:#ff5d8f; --dred:#c23d68; --green:#2fe3c6; --blue:#7aa8ff;
  --display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font-family:var(--body)}

.appwin{
  width:1040px;height:650px;border-radius:26px;overflow:hidden;position:relative;
  background:
    radial-gradient(60% 55% at 12% 0%, rgba(122,92,255,.38), transparent 68%),
    radial-gradient(46% 46% at 70% -10%, rgba(255,93,143,.22), transparent 70%),
    radial-gradient(60% 60% at 108% 108%, rgba(47,227,198,.30), transparent 70%),
    var(--bg);
  color:var(--text);
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;
}
.glass{
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
}

.awin-head{display:flex;align-items:center;justify-content:space-between;padding:20px 26px 0}
.awin-brand{display:flex;align-items:center;gap:12px;font:800 17px var(--display);letter-spacing:-.01em}
.awin-brand img{width:30px;height:30px;border-radius:8px}
.pills{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;font:600 11px var(--body);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:var(--muted)}
.pill.on{background:rgba(47,227,198,.14);border-color:rgba(80,240,215,.4);color:var(--text)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.pill .dot.teal{background:var(--green);box-shadow:0 0 8px rgba(47,227,198,.8)}
.round-btn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}

.awin-body{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px 26px 0}

.np-card{padding:26px 22px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.disc-wrap{position:relative;width:184px;height:184px;margin-top:4px}
.disc-ring{
  position:absolute;inset:-10px;border-radius:50%;padding:5px;
  background:conic-gradient(from -90deg,#7a5cff 0%,#ff4e8c 28%,#c46ea8 50%,#28d6c4 62%,#3c96f0 82%,#7a5cff 100%);
  filter:drop-shadow(0 0 22px rgba(122,92,255,.45));
}
.disc-ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.disc{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:
    radial-gradient(circle at 34% 30%, rgba(255,255,255,.22), transparent 42%),
    conic-gradient(from 0deg,#2a2152,#3a2a66,#512a52,#2a3a5e,#2a2152);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);
  animation:spin 9s linear infinite;
}
.disc .grooves{position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,
    rgba(0,0,0,.32) 0 2px, rgba(255,255,255,.08) 2px 3px, transparent 3px 10px);
}
.disc .hole{position:absolute;left:50%;top:50%;width:15px;height:15px;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--bg);box-shadow:0 0 0 7px rgba(0,0,0,.28)}
@keyframes spin{to{transform:rotate(360deg)}}
.appwin.paused .disc{animation-play-state:paused}

.state-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font:700 11px var(--body);
  background:rgba(47,227,198,.14);border:1px solid rgba(80,240,215,.35);color:var(--green)}
.appwin.paused .state-pill{background:rgba(255,93,143,.16);border-color:rgba(255,125,170,.4);color:#ffb3c8}
.state-pill .mini-bars{display:flex;align-items:center;gap:2px;height:11px}
.state-pill .mini-bars i{width:2px;height:5px;border-radius:2px;background:currentColor;animation:beat .9s ease-in-out infinite}
.state-pill .mini-bars i:nth-child(2){animation-duration:.7s}
.state-pill .mini-bars i:nth-child(3){animation-duration:1.1s}
.state-pill .mini-bars i:nth-child(4){animation-duration:.8s}
.appwin.paused .mini-bars i{animation:none;height:3px}
@keyframes beat{0%,100%{height:3px}50%{height:11px}}

.np-text{display:flex;flex-direction:column;align-items:center;gap:3px}
.np-title{font:800 17px var(--display);letter-spacing:-.01em;text-align:center}
.np-artist{font:500 12px var(--body);color:var(--muted)}
.np-controls{display:flex;align-items:center;gap:14px;margin-top:2px}
.ctrl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:var(--text);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.ctrl.toggle{width:52px;height:52px;background:linear-gradient(135deg,var(--green),#1fb39d);border-color:rgba(255,255,255,.25);
  font-size:16px;color:#06251f}
.appwin.paused .ctrl.toggle{background:linear-gradient(135deg,var(--red),var(--dred));color:#fff}

.mb-card{padding:20px 22px}
.mb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mb-head h3{margin:0;font:800 14px var(--display);letter-spacing:-.01em}
.mode-switch{position:relative;display:flex;width:168px;height:30px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);cursor:pointer;user-select:none}
.mode-switch .knob{position:absolute;top:3px;left:3px;width:80px;height:24px;border-radius:999px;
  background:linear-gradient(135deg,var(--green),#1fb39d);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.appwin.volmode .mode-switch .knob{transform:translateX(80px);background:linear-gradient(135deg,var(--blue),#5a82e0)}
.mode-switch span{flex:1;display:flex;align-items:center;justify-content:center;font:700 10.5px var(--body);
  color:var(--muted);position:relative;z-index:1;transition:color .2s}
.appwin:not(.volmode) .mode-switch span:first-child{color:var(--bg)}
.appwin.volmode .mode-switch span:last-child{color:var(--bg)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:13px;
  padding:12px 14px;display:flex;flex-direction:column;gap:7px;min-height:58px;justify-content:center}
.tile .tname{font:700 11.5px var(--body);letter-spacing:-.005em}
.pm-view,.vm-view{display:flex;align-items:center;justify-content:space-between;gap:10px}
.appwin.volmode .pm-view{display:none}
.appwin:not(.volmode) .vm-view{display:none}
.tdesc{font:500 9.5px var(--body);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:9px;font-size:11px}
.chip.Play{background:rgba(47,227,198,.18);color:var(--green);border:1px solid rgba(80,240,215,.4)}
.chip.Pause{background:rgba(255,93,143,.2);color:var(--red);border:1px solid rgba(255,125,170,.4)}
.chip.None{background:rgba(255,255,255,.08);color:var(--faint);border:1px solid rgba(255,255,255,.14)}
.vbar{flex:1;height:5px;border-radius:99px;background:var(--panel3);position:relative}
.vbar i{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:var(--green);display:block}
.vpct{font:700 10px var(--body);color:var(--muted);width:30px;text-align:right}

.awin-foot{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:16px 26px 20px}
.mini-card{padding:14px 18px}
.mini-card h4{margin:0 0 8px;font:800 11px var(--display);letter-spacing:-.005em}
.gstate{font:700 12.5px var(--body)}
.gstate.pause{color:#ffb3c8}
.apps-row{display:flex;gap:8px;flex-wrap:wrap}
.app-chip{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);font:600 10.5px var(--body);color:var(--text)}
.app-chip i{width:7px;height:7px;border-radius:50%}

.mode-hint{position:absolute;top:-22px;right:0;font:600 10px var(--body);color:var(--muted);
  opacity:0;transition:opacity .25s}
.mb-head{position:relative}
.mb-head:hover .mode-hint{opacity:1}

@media (prefers-reduced-motion:reduce){
  .disc{animation:none}
  .state-pill .mini-bars i{animation:none;height:7px}
  .mode-switch .knob{transition:none}
}
</style>
</head>
<body>

<div class="appwin" id="appwin">
  <div class="awin-head">
    <div class="awin-brand"><img src="logo.png" alt=""><span>VibePause</span></div>
    <div class="pills">
      <span class="pill on"><i class="dot teal"></i>VALORANT running</span>
      <span class="pill on"><i class="dot teal"></i>Active</span>
      <span class="round-btn">&#9881;</span>
    </div>
  </div>

  <div class="awin-body">
    <div class="np-card glass">
      <div class="disc-wrap">
        <div class="disc-ring"></div>
        <div class="disc"><div class="grooves"></div><div class="hole"></div></div>
      </div>
      <div class="state-pill" id="statePill">
        <span class="mini-bars"><i></i><i></i><i></i><i></i></span>
        <span id="stateText">In match</span>
      </div>
      <div class="np-text">
        <div class="np-title">Gymnop&eacute;die No. 1</div>
        <div class="np-artist">Erik Satie &middot; public domain</div>
      </div>
      <div class="np-controls">
        <span class="ctrl">&#9198;</span>
        <span class="ctrl toggle" id="toggleBtn">&#10073;&#10073;</span>
        <span class="ctrl">&#9197;</span>
      </div>
    </div>

    <div class="mb-card glass">
      <div class="mb-head">
        <h3>Music behaviour</h3>
        <div>
          <div class="mode-hint">Click to switch modes</div>
          <div class="mode-switch" id="modeSwitch" role="button" tabindex="0" aria-label="Switch between Pause mode and Volume mode">
            <div class="knob"></div>
            <span>Pause</span><span>Volume</span>
          </div>
        </div>
      </div>
      <div class="tiles" id="tiles"></div>
    </div>
  </div>

  <div class="awin-foot">
    <div class="mini-card glass">
      <h4>Game status</h4>
      <div class="gstate pause" id="gstate">Combat start &mdash; music paused</div>
    </div>
    <div class="mini-card glass">
      <h4>Supported media</h4>
      <div class="apps-row">
        <span class="app-chip"><i style="background:#4285f4"></i>Chrome</span>
        <span class="app-chip"><i style="background:#ff0000"></i>YouTube Music</span>
        <span class="app-chip"><i style="background:#fa57c1"></i>Apple Music</span>
        <span class="app-chip"><i style="background:#1db954"></i>Spotify</span>
      </div>
    </div>
  </div>
</div>

<script>
const EVENTS=[
  ["Combat Start","A round becomes active","Pause",20],
  ["Player Eliminated","The local player dies during a round","Play",100],
  ["Match Started","The match becomes active","Play",100],
  ["Buy Phase Started","The buy phase opens","Play",100],
  ["Match Ended","The match ends","Play",100],
  ["Returned to Lobby","You return to the main menu","Play",100],
  ["Agent Selection","Agent selection opens","Play",100],
  ["Ultimate Used","You are revived by an ultimate","Play",100],
];
const tiles=document.getElementById("tiles");
EVENTS.forEach(([name,desc,action,vol])=>{
  const t=document.createElement("div");
  t.className="tile";
  t.innerHTML=
    '<div class="tname">'+name+'</div>'+
    '<div class="pm-view"><div class="tdesc">'+desc+'</div><span class="chip '+action+'">'+
      (action==="Play"?"&#9654;":action==="Pause"?"&#10073;&#10073;":"")+'</span></div>'+
    '<div class="vm-view"><div class="vbar"><i style="width:'+vol+'%"></i></div><span class="vpct">'+vol+'%</span></div>';
  tiles.appendChild(t);
});

const appwin=document.getElementById("appwin");
const modeSwitch=document.getElementById("modeSwitch");
const flipMode=()=>{
  const vol=appwin.classList.toggle("volmode");
  modeSwitch.setAttribute("aria-pressed",vol);
};
modeSwitch.addEventListener("click",flipMode);
modeSwitch.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();flipMode();}
});
const toggleBtn=document.getElementById("toggleBtn");
toggleBtn.addEventListener("click",()=>{
  const paused=appwin.classList.toggle("paused");
  document.getElementById("stateText").textContent = paused ? "Paused for your match" : "In match";
  toggleBtn.innerHTML = paused ? "&#9654;" : "&#10073;&#10073;";
});

// Cycle through a couple of game states on its own, slowly, so the preview feels alive
// without needing a click. Respects reduced-motion by just not animating further.
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  let i = 0;
  const cycle = [
    ["In match", false],
    ["Paused for your match", true],
    ["In match", false],
    ["In the menu", false],
  ];
  setInterval(() => {
    i = (i + 1) % cycle.length;
    const [text, paused] = cycle[i];
    appwin.classList.toggle("paused", paused);
    document.getElementById("stateText").textContent = text;
    toggleBtn.innerHTML = paused ? "&#9654;" : "&#10073;&#10073;";
  }, 4200);
}
</script>
</body>
</html>
